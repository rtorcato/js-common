name: 📘 Deploy docs

on:
    push:
        branches: [main]
        paths:
            - 'apps/docs/**'
            - '.github/workflows/docs.yml'
            - 'pnpm-workspace.yaml'
    # A release must redeploy the site, or the changelog page — built from the
    # GitHub Releases API by scripts/sync-changelog.mjs — silently stops at
    # whatever the last apps/docs change saw. That is done by the `release` job
    # in ci.yml dispatching this workflow on `main`, NOT by subscribing to the
    # `release` event here: that event runs with `github.ref` set to the tag.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # Primary site: https://docs.torcato.dev/js-common/ (config.docs in .repo-tooling.json).
    # Pinned to a tag, never @main: this job hands over the Cloudflare secrets.
    cloudflare:
        permissions:
            contents: read
        uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@v5.5.2
        with:
            build-filter: '@rtorcato/js-common-docs'
            worker-name: js-common-docs
            base-path: /js-common/
            route: docs.torcato.dev/js-common/*
        secrets:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # Old site: rtorcato.github.io/js-common/ now only redirects to the new address.
    # GitHub Pages can't redirect server-side, so every path gets a meta-refresh
    # stub (index.html, plus 404.html so deep links land on the same page there).
    # Delete these two jobs once Pages is disabled in the repo settings.
    pages-redirect-build:
        runs-on: ubuntu-latest
        steps:
            - name: 🏗️ Write redirect stub
              run: |
                  mkdir -p stub
                  cat > stub/index.html <<'EOF'
                  <!doctype html>
                  <html lang="en">
                  <head>
                  <meta charset="utf-8">
                  <title>js-common docs have moved</title>
                  <link rel="canonical" href="https://docs.torcato.dev/js-common/">
                  <meta name="robots" content="noindex">
                  <meta http-equiv="refresh" content="0; url=https://docs.torcato.dev/js-common/">
                  <script>
                  location.replace('https://docs.torcato.dev' + location.pathname + location.search + location.hash)
                  </script>
                  </head>
                  <body>
                  <p>The js-common docs have moved to <a href="https://docs.torcato.dev/js-common/">docs.torcato.dev/js-common</a>.</p>
                  </body>
                  </html>
                  EOF
                  cp stub/index.html stub/404.html

            - name: 📤 Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: stub

    pages-redirect-deploy:
        needs: pages-redirect-build
        runs-on: ubuntu-latest
        concurrency:
            group: pages
            cancel-in-progress: false
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 🚀 Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
