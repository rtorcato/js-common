name: 📘 Deploy docs to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - 'apps/docs/**'
            - '.github/workflows/docs.yml'
            - 'pnpm-workspace.yaml'
    # The changelog page is built from GitHub Releases at build time
    # (scripts/sync-changelog.mjs), so a release has to redeploy the site or the
    # published page silently stops at whatever the last apps/docs change saw.
    release:
        types: [published]
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: false

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: pnpm

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗️ Build Docusaurus site
              run: pnpm --filter @rtorcato/js-common-docs build
              env:
                  # Lifts the 60/hr unauthenticated limit on the Releases fetch in
                  # scripts/sync-changelog.mjs. The build falls back to CHANGELOG.md
                  # without it, so this is a safeguard rather than a requirement.
                  GITHUB_TOKEN: ${{ github.token }}

            - name: 📤 Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: apps/docs/build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 🚀 Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
