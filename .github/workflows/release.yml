name: 🚀 Release

# On demand only, never per merge (#740): a dispatch (hotfix, ad hoc) or a
# closed milestone ("ship this batch").
on:
  workflow_dispatch:
  milestone:
    types: [closed]

# A newer request supersedes an older one still waiting for approval (#753).
concurrency:
  group: release
  cancel-in-progress: true

jobs:
    release:
        runs-on: ubuntu-latest
        # Merging and publishing are otherwise the same event, so a PR title that
        # hides a BREAKING CHANGE footer in its body can ship a major unattended.
        # The environment holds this job until a human approves it.
        environment: release
        # `beta` is a semantic-release prerelease branch: same job, but
        # @semantic-release/npm publishes it under the `beta` dist-tag, so
        # `npm install @rtorcato/js-common` (i.e. `latest`) never picks it up.
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
            # Lets the release job dispatch docs.yml after a publish, so the changelog
            # page (built from the GitHub Releases API) picks the new version up.
            actions: write
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  registry-url: https://registry.npmjs.org

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🔧 Configure Git
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: 🏗️ Build for release
              run: pnpm run build-prod

            # OIDC trusted publishing needs npm CLI >= 11.5.1; the runner ships 10.x.
            - name: 📦 Upgrade npm for OIDC trusted publishing
              run: npm install -g npm@latest

            - name: 🚀 Run semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
              run: npx semantic-release

            # The changelog page is built from the GitHub Releases API at docs
            # build time, so a publish only reaches the site once the site is
            # rebuilt. docs.yml cannot subscribe to `release` itself: that event
            # runs with `github.ref` set to the tag, and the `github-pages`
            # environment only accepts deployments from `main` — the build
            # succeeds and the deploy is rejected. Dispatching on `main` instead
            # keeps that protection intact.
            - name: 📘 Redeploy the docs after a publish
              # The publish has already happened by this point, so a hiccup here
              # must not fail the job — that would fire the reporter below and
              # open an issue saying nothing was published, which would be a lie.
              # Worst case the docs refresh on the next apps/docs change.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag=$(git tag --points-at HEAD | head -1)
                  if [ -z "$tag" ]; then
                      echo "No tag on HEAD — semantic-release published nothing. Skipping."
                      exit 0
                  fi
                  echo "Published $tag — dispatching docs.yml on main."
                  gh workflow run docs.yml --ref main

            # Releases failed silently from 2026-08-08 to 2026-08-11 because nothing
            # surfaced the failure — every merge in between was a `test:` commit that
            # correctly produced no release, so the breakage stayed invisible.
            # Did anything actually ship? semantic-release can fail *after* the
            # publish — its `success` lifecycle runs once npm and the GitHub
            # release are already done — so a failed job does not imply a failed
            # release. Resolve it here rather than letting the reporter guess.
            - name: 🔎 Determine whether the release shipped
              id: shipped
              if: failure()
              run: |
                  git fetch --tags --quiet || true
                  tag=$(git tag --points-at HEAD | head -1)
                  if [ -n "$tag" ]; then
                      echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=" >> "$GITHUB_OUTPUT"
                  fi

            # Releases failed silently from 2026-08-08 to 2026-08-11 because nothing
            # surfaced the failure — every merge in between was a `test:` commit that
            # correctly produced no release, so the breakage stayed invisible.
            - name: 🔔 Report release failure
              if: failure()
              uses: actions/github-script@v9
              with:
                  script: |
                      const tag = '${{ steps.shipped.outputs.tag }}'
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                      // Never assert "nothing was published" without checking — #215
                      // was filed saying exactly that about a release that had
                      // already put 3.0.0 on npm, because ~30 courtesy comments
                      // 503'd after the publish.
                      const outcome = tag
                        ? [
                            `**\`${tag}\` was published.** The job failed *after* the release completed,`,
                            'so npm and the GitHub release are fine — check which post-publish step',
                            'failed before assuming anything is broken.',
                          ]
                        : [
                            '**Nothing was published.** No tag exists on this commit, so the job',
                            'failed before or during the release itself. Releases stay blocked',
                            'until this is fixed.',
                          ]
                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: tag
                          ? `Release job failed after publishing ${tag}`
                          : `Release failed on ${context.sha.slice(0, 7)}`,
                        body: [
                          `The \`release\` job failed on \`${context.sha}\`.`,
                          '',
                          ...outcome,
                          '',
                          `[View the run](${runUrl})`,
                        ].join('\n'),
                        labels: ['bug'],
                      })
