name: 🚀 CI/CD Pipeline

on:
    push:
        branches: [main, master, beta]
    pull_request:
        branches: [main, master, beta]
    # Required for GitHub merge queue. Without it, checks never run against the
    # merge group and every queued PR waits forever on contexts that cannot arrive.
    merge_group:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    check-skip:
        runs-on: ubuntu-latest
        outputs:
            should-skip: ${{ steps.skip-check.outputs.should-skip }}
        steps:
            - name: Check for skip CI
              id: skip-check
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [[ "$COMMIT_MSG" =~ \[(ci skip|skip ci)\] ]]; then
                    echo "should-skip=true" >> $GITHUB_OUTPUT
                  else
                    echo "should-skip=false" >> $GITHUB_OUTPUT
                  fi

    dependencies:
        runs-on: ubuntu-latest
        needs: check-skip
        if: needs.check-skip.outputs.should-skip != 'true'
        outputs:
            cache-key: ${{ steps.cache-key.outputs.key }}
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Generate cache key
              id: cache-key
              run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

            - name: 📦 Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ steps.cache-key.outputs.key }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

    lint:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🔍 Run linting
              run: pnpm run check

            # AGENTS.md is generated from skills/js-common/SKILL.md — fail the PR
            # rather than let the two copies of the agent guidance drift apart.
            - name: 🤖 Check AGENTS.md is in sync with SKILL.md
              run: node scripts/sync-agents.mjs --check

            # Guards the MODULE-BOUNDARIES.md freeze: a module shipping without a
            # README entry, a name exported from two subpaths, or a doc example
            # importing something the module does not export.
            - name: 📚 Check module boundaries and doc examples
              run: node scripts/check-readme-exports.mjs --check

    commitlint:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 📝 Validate commit messages
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    typecheck:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🔍 Type check
              run: pnpm typecheck

    test:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        strategy:
            fail-fast: false
            matrix:
                node-version: ['22', '24']
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🧪 Run tests
              run: pnpm test

    build:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🏗️ Build project
              run: pnpm run build-prod

            - name: 📦 Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build-artifacts
                  path: |
                      dist/
                      package.json
                      README.md
                  retention-days: 7

    docs-build:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            # The cache above only carries the root node_modules, never
            # apps/docs/node_modules. This job used to get away with that
            # because pnpm auto-installed the missing workspace deps before
            # running the script; with verifyDepsBeforeRun disabled it no
            # longer does, so install explicitly like every other job.
            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 📘 Build docs site
              run: pnpm --filter @rtorcato/js-common-docs build

    release:
        runs-on: ubuntu-latest
        # Merging and publishing are otherwise the same event, so a PR title that
        # hides a BREAKING CHANGE footer in its body can ship a major unattended.
        # The environment holds this job until a human approves it.
        environment: release
        needs: [dependencies, lint, typecheck, test, build, check-skip]
        # `beta` is a semantic-release prerelease branch: same job, but
        # @semantic-release/npm publishes it under the `beta` dist-tag, so
        # `npm install @rtorcato/js-common` (i.e. `latest`) never picks it up.
        if: needs.check-skip.outputs.should-skip != 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name == 'push'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  registry-url: https://registry.npmjs.org

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🔧 Configure Git
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: 🏗️ Build for release
              run: pnpm run build-prod

            # OIDC trusted publishing needs npm CLI >= 11.5.1; the runner ships 10.x.
            - name: 📦 Upgrade npm for OIDC trusted publishing
              run: npm install -g npm@latest

            - name: 🚀 Run semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
              run: npx semantic-release

            # Releases failed silently from 2026-08-08 to 2026-08-11 because nothing
            # surfaced the failure — every merge in between was a `test:` commit that
            # correctly produced no release, so the breakage stayed invisible.
            - name: 🔔 Report release failure
              if: failure()
              uses: actions/github-script@v9
              with:
                  script: |
                      await github.rest.issues.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: `Release failed on ${context.sha.slice(0, 7)}`,
                        body: [
                          `The \`release\` job failed on \`${context.sha}\`.`,
                          '',
                          `[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                          '',
                          'Nothing was published. Releases stay blocked until this is fixed.',
                        ].join('\n'),
                        labels: ['bug'],
                      })
