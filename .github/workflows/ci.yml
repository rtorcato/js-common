name: 🚀 CI/CD Pipeline

on:
    push:
        branches: [main, master, beta]
    pull_request:
        branches: [main, master, beta]
    # Required for GitHub merge queue. Without it, checks never run against the
    # merge group and every queued PR waits forever on contexts that cannot arrive.
    merge_group:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Only cancel superseded PR runs. A push to main carries the release job, and
    # killing that mid-publish can leave a tag with no npm publish behind it — so
    # back-to-back pushes queue instead of cancelling.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write
    # Lets the release job dispatch docs.yml after a publish, so the changelog
    # page (built from the GitHub Releases API) picks the new version up.
    actions: write

jobs:
    check-skip:
        runs-on: ubuntu-latest
        outputs:
            should-skip: ${{ steps.skip-check.outputs.should-skip }}
        steps:
            - name: Check for skip CI
              id: skip-check
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [[ "$COMMIT_MSG" =~ \[(ci skip|skip ci)\] ]]; then
                    echo "should-skip=true" >> $GITHUB_OUTPUT
                  else
                    echo "should-skip=false" >> $GITHUB_OUTPUT
                  fi

    dependencies:
        runs-on: ubuntu-latest
        needs: check-skip
        if: needs.check-skip.outputs.should-skip != 'true'
        outputs:
            cache-key: ${{ steps.cache-key.outputs.key }}
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Generate cache key
              id: cache-key
              run: echo "key=${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

            - name: 📦 Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ steps.cache-key.outputs.key }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

    lint:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🔍 Run linting
              run: pnpm run check

            # AGENTS.md is generated from skills/js-common/SKILL.md — fail the PR
            # rather than let the two copies of the agent guidance drift apart.
            - name: 🤖 Check AGENTS.md is in sync with SKILL.md
              run: node scripts/sync-agents.mjs --check

            # Guards the MODULE-BOUNDARIES.md freeze: a module shipping without a
            # README entry, a name exported from two subpaths, or a doc example
            # importing something the module does not export.
            - name: 📚 Check module boundaries and doc examples
              run: node scripts/check-readme-exports.mjs --check

    commitlint:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 📝 Validate commit messages
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    typecheck:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🔍 Type check
              run: pnpm typecheck

    test:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        strategy:
            fail-fast: false
            matrix:
                node-version: ['22', '24', '26']
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            # Coverage is the test run itself, so a separate coverage job would only repeat it.
            - name: 🧪 Run tests with coverage
              run: pnpm run coverage

            - name: 📊 Upload coverage to Codecov
              if: matrix.node-version == '24'
              uses: codecov/codecov-action@v7
              with:
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false

            # UTC+12/13 surfaces local-vs-UTC mixups that UTC and US zones hide (#323).
            - name: 🧪 Run date tests under Pacific/Auckland
              run: pnpm vitest run src/date
              env:
                  TZ: Pacific/Auckland

    build:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 🏗️ Build project
              run: pnpm run build-prod

            - name: 📏 Per-subpath size budgets (size-limit)
              run: pnpm size

            - name: 📦 Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build-artifacts
                  path: |
                      dist/
                      package.json
                      README.md
                  retention-days: 7

    # The test job only ever executes on Node. This imports every universal module
    # (package.json#exports minus NODE_ONLY) from the built dist/ under Bun and Deno,
    # so a "universal" label that only holds on Node fails here.
    runtime-smoke:
        runs-on: ubuntu-latest
        needs: [dependencies, build, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        strategy:
            fail-fast: false
            matrix:
                runtime: [bun, deno]
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            # uuid, validation etc. import their npm dependencies at load time.
            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            - name: 📦 Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: build-artifacts

            - name: 🥟 Setup Bun
              if: matrix.runtime == 'bun'
              uses: oven-sh/setup-bun@v2

            - name: 🦕 Setup Deno
              if: matrix.runtime == 'deno'
              uses: denoland/setup-deno@v2

            - name: 💨 Smoke-import universal modules (Bun)
              if: matrix.runtime == 'bun'
              run: bun scripts/smoke-import.mjs

            - name: 💨 Smoke-import universal modules (Deno)
              if: matrix.runtime == 'deno'
              run: deno run --allow-read --allow-env --allow-sys scripts/smoke-import.mjs

    docs-build:
        runs-on: ubuntu-latest
        needs: [dependencies, check-skip]
        if: needs.check-skip.outputs.should-skip != 'true'
        steps:
            - name: 📦 Checkout repository
              uses: actions/checkout@v7

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v6

            - name: 📦 Restore dependencies cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ needs.dependencies.outputs.cache-key }}

            # The cache above only carries the root node_modules, never
            # apps/docs/node_modules. This job used to get away with that
            # because pnpm auto-installed the missing workspace deps before
            # running the script; with verifyDepsBeforeRun disabled it no
            # longer does, so install explicitly like every other job.
            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 📘 Build docs site
              run: pnpm --filter @rtorcato/js-common-docs build
